<!DOCTYPE html>
<html lang="en" class="has-navbar-fixed-top">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Incident Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

</head>
<body>
    <header>
        <nav class="navbar has-shadow is-fixed-top" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">AI Incident Lab</a>
                <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbar-menu">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>
            <div id="navbar-menu" class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item" href="/equipements">Équipements</a>
                    <a class="navbar-item" href="/incidents">Incidents</a>
                </div>
                <div class="navbar-end">
                    <!--<a class="navbar-item" href="/dashboard">Dashboard</a>-->
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="title">AI Incident Lab</h1>
                <p class="subtitle">Bienvenue !</p>
               
                <a class="button is-light" href="/equipements">Voir les équipements</a>
            </div>

        </section>
    </main>

    <script>
        const navbarBurger = document.querySelector(".navbar-burger");
        const navbarMenu = document.querySelector(`#${navbarBurger.dataset.target}`);

        navbarBurger.addEventListener("click", () => {
            navbarBurger.classList.toggle("is-active");
            navbarMenu.classList.toggle("is-active");
            navbarBurger.setAttribute("aria-expanded", navbarBurger.classList.contains("is-active"));
        });
    </script>
</body>
</html>
