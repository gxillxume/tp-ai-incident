<!DOCTYPE html>
<html lang="en" class="has-navbar-fixed-top">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Incident Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

</head>
<body>

    <header>
        <nav class="navbar has-shadow is-fixed-top" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">AI Incident Lab</a>
            </div>
            <div class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item" href="/equipements">Équipements</a>
                    <a class="navbar-item" href="/incidents">Incidents</a>
                </div>
                <div class="navbar-end">
                    <!--<a class="navbar-item" href="/dashboard">Dashboard</a>-->
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <h1 class="title">Équipements</h1>
                <p class="subtitle">Liste des équipements
                    <a class="button link is-success" href="./equipements/nouveau">Ajouter</a>
                </p>
                
                <input class="input" id="search-input" name="q" type="search" placeholder="Rechercher...">
                <table class="table is-striped is-fullwidth">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Type</th>
                            <th>Adresse IP</th>
                            <th>OS</th>
                            <th>Localisation</th>
                        </tr>
                    </thead>
                    <tbody id="equipements-list"></tbody>
                    <p id="message" class="message" aria-live="polite" hidden></p>
                </table>
            </div>

        </section>
    </main>

    <script src="/js/equipements/equipements.js"></script>
</body>
</html>
